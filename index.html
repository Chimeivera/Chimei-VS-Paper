<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>115 年度進度與歷年論文獎金統計</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
<style>
/* 佳里院區「醫療科技」識別：深色儀表側欄＋監視器讀數 KPI＋心電圖主視覺；數據區淺底近黑字，利於閱讀與列印 */
:root{
  --bg:#EAF1F3; --grid:rgba(8,90,110,.055); --surface:#FFFFFF; --surface2:#F3F8F9; --zebra:#F3F8F9; --total:#DFEEF1;
  --ink:#0B1D26; --ink2:#29404B; --muted:#4F6A75; --rule:#CCDCE1;
  --deck:#07212C; --deck2:#0D2F3D; --deck-line:#1C4A5A; --deck-ink:#E8F6F8; --deck-ink2:#A6C8D0;
  --cyan:#0A8F9C; --cyan-hi:#2BE0E8; --cyan-soft:#8FCCD3; --link:#07707E; --warm:#E07A2E;
  --thead:#0B2A36; --thead-ink:#FFFFFF; --up:#0B7A55; --dn:#B4472A;
  --c1:#0A8F9C; --c2:#3D63DD; --c3:#E07A2E; --c4:#A855C7;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08161D; --grid:rgba(43,224,232,.045); --surface:#0F2430; --surface2:#13303D; --zebra:#122B37; --total:#173847;
  --ink:#E4F1F4; --ink2:#BCD2D8; --muted:#93AEB6; --rule:#23434F;
  --deck:#04131A; --deck2:#0B2632; --deck-line:#1A4352; --cyan:#0FA0AC; --cyan-soft:#2C6C77; --link:#6FD6E2;
  --thead:#0A2430; --up:#4CD69A; --dn:#FF8A6B; --c1:#0FA0AC; --c2:#5A76EE; --c3:#D9762C; --c4:#B565D6; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#08161D; --grid:rgba(43,224,232,.045); --surface:#0F2430; --surface2:#13303D; --zebra:#122B37; --total:#173847;
  --ink:#E4F1F4; --ink2:#BCD2D8; --muted:#93AEB6; --rule:#23434F;
  --deck:#04131A; --deck2:#0B2632; --deck-line:#1A4352; --cyan:#0FA0AC; --cyan-soft:#2C6C77; --link:#6FD6E2;
  --thead:#0A2430; --up:#4CD69A; --dn:#FF8A6B; --c1:#0FA0AC; --c2:#5A76EE; --c3:#D9762C; --c4:#B565D6; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.mast{position:relative;overflow:hidden;background:var(--deck);color:var(--deck-ink)}
.mast-in{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:16px 28px 6px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center}
.brand{display:flex;gap:12px;align-items:center;padding-right:24px;border-right:1px solid var(--deck-line)}
.brand svg{height:52px;width:auto;flex:none}
.brand b{display:block;font-size:21px;letter-spacing:.16em;white-space:nowrap;line-height:1.2}
.brand .nw{display:inline-block}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--deck-ink2);margin-top:3px}
.ttl{min-width:0}
.ttl h1{margin:0;font-size:clamp(21px,2vw,28px);font-weight:700;letter-spacing:.03em;line-height:1.25;color:#fff;display:flex;flex-wrap:wrap;column-gap:.4em;align-items:baseline}
.ttl h1 .yr{white-space:nowrap;font-family:var(--mono);font-weight:600;color:var(--cyan-hi);letter-spacing:0}
.ttl h1 .yr small{font-family:var(--sans);font-weight:700;font-size:1em;color:#fff;letter-spacing:.03em}
.ttl h1 .nm{white-space:nowrap}
.ttl .meta{margin:7px 0 0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13.5px;color:var(--deck-ink)}
.ttl .meta span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ttl .meta svg{color:var(--cyan-hi);font-size:12px}
@media (min-width:981px) and (max-width:1360px){.acts .sbtn{padding:8px 12px;font-size:13.5px}.mast-in{gap:20px}.acts{flex-wrap:nowrap}}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sync{font-family:var(--mono);font-size:12px;color:var(--deck-ink2);display:flex;align-items:center;gap:8px;margin-right:4px}
.sync i.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan-hi);box-shadow:0 0 0 3px rgba(43,224,232,.18)}
.sbtn{font:inherit;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;border-radius:8px;cursor:pointer;padding:8px 16px;white-space:nowrap}
.sbtn.ghost{background:transparent;color:var(--deck-ink);border:1px solid var(--deck-line)}
.sbtn.ghost:hover{border-color:var(--cyan-hi)}
.sbtn.fill{position:relative;overflow:hidden;background:var(--cyan);color:#fff;border:1px solid var(--cyan)}
.sbtn.fill:hover{filter:brightness(1.08)}
.sbtn:disabled{opacity:.6;cursor:progress}
.ecg-strip{display:block;width:100%;height:34px;position:relative;z-index:1}
svg .base{fill:none;stroke:rgba(43,224,232,.28);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
svg.ecg .hero-line{stroke:rgba(43,224,232,.75);stroke-width:2;filter:drop-shadow(0 0 3px rgba(43,224,232,.5))}
svg .run{fill:none;stroke:var(--cyan-hi);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:6 94;stroke-dashoffset:60;filter:drop-shadow(0 0 4px rgba(43,224,232,.8))}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deck2);border-bottom:1px solid var(--deck-line);box-shadow:0 8px 20px -14px rgba(4,19,26,.6)}
.nav-in{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));padding:0 16px}
.nav button{position:relative;font:inherit;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--deck-ink2);background:none;border:0;padding:11px 4px 10px;cursor:pointer;white-space:nowrap;min-width:0;border-radius:8px 8px 0 0}
.nav button .ic{font-size:17px;line-height:1}
.nav button:hover{color:var(--deck-ink);background:rgba(255,255,255,.03)}
.nav button[aria-selected="true"]{color:#fff;font-weight:700;background:rgba(43,224,232,.07)}
.nav button[aria-selected="true"] .ic{color:var(--cyan-hi)}
.nav button[aria-selected="true"]::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--cyan-hi);box-shadow:0 0 8px rgba(43,224,232,.55)}
/* ---------- pages */
main{padding:24px 28px 40px;min-width:0}
.card{max-width:1420px;margin:0 auto;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:26px 32px 0;box-shadow:0 1px 0 rgba(7,33,44,.04),0 10px 30px -18px rgba(7,33,44,.25);display:flex;flex-direction:column;min-height:calc(100vh - 230px)}
.card[hidden]{display:none}
.cbody{flex:1;min-width:0}
.cfoot{border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:12px 0 14px;margin-top:26px}
.cfoot .cut{font-family:var(--mono)}
.sh{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.sh .icb{width:46px;height:46px;border-radius:10px;background:var(--deck);color:var(--cyan-hi);display:grid;place-items:center;font-size:19px;flex:none}
.sh .tx{flex:1;min-width:220px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--cyan);margin:0 0 2px;text-transform:uppercase}
h2.pt{font-size:27px;margin:0;color:var(--ink);font-weight:700;line-height:1.3;text-wrap:balance}
.psub{color:var(--ink2);font-size:15.5px;margin:4px 0 0}
.unit{font-family:var(--mono);font-size:12px;color:var(--ink2);border:1px solid var(--rule);border-radius:999px;padding:3px 10px;align-self:center}
.stitle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin:24px 0 10px;color:var(--ink)}
.stitle::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--cyan);transform:rotate(45deg)}
.note{font-size:13.5px;color:var(--ink2);margin-top:12px}
.center{text-align:center}

/* ---------- overview hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--deck);color:var(--deck-ink);border-radius:12px;overflow:hidden;min-height:360px}
.hero .lt{position:relative;z-index:2;padding:34px 34px 70px;display:flex;flex-direction:column;gap:14px}
.hero .hl{margin:0;font-size:18px;font-weight:700;color:var(--deck-ink);letter-spacing:.06em}
.deltas{display:grid;grid-template-columns:repeat(2,minmax(0,max-content));gap:16px 44px;margin-top:4px}
.deltas>div{display:flex;flex-direction:column;gap:2px}
.deltas .lab{font-size:15px;color:var(--deck-ink2)}
.deltas .big{font-family:var(--mono);font-weight:600;font-size:clamp(44px,5vw,64px);line-height:1.05;display:inline-flex;align-items:center;gap:6px;color:var(--cyan-hi)}
.deltas .big svg{font-size:.6em}
.deltas .big.dn{color:#FF8A6B}
.deltas .ft{font-family:var(--mono);font-size:15px;color:var(--deck-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:13px;border:1px solid var(--deck-line);background:rgba(255,255,255,.03);color:var(--deck-ink);border-radius:999px;padding:4px 12px;display:inline-flex;gap:6px;align-items:center}
.chips span svg{color:var(--cyan-hi)}
.hero .ph{position:relative;min-height:260px}
.hero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 70%;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%)}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(7,33,44,.55),rgba(7,33,44,0) 45%)}
.vsign{position:absolute;right:22px;top:24px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:19px;line-height:1;font-weight:700;color:#fff;background:rgba(7,33,44,.55);border:1px solid rgba(255,255,255,.28);padding:12px 9px;border-radius:4px;backdrop-filter:blur(4px)}
.hero .ecg{position:absolute;left:0;right:0;bottom:16px;height:46px;width:100%;z-index:1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:18px}
.mon{position:relative;background:var(--deck);color:var(--deck-ink);border-radius:10px;padding:16px 18px 14px;border:1px solid var(--deck-line);min-width:0}
.mon::before,.mon::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cyan-hi);opacity:.8}
.mon::before{top:7px;left:7px;border-right:0;border-bottom:0}
.mon::after{bottom:7px;right:7px;border-left:0;border-top:0}
.mon .lb{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--deck-ink2);gap:8px}
.mon .lb small{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em}
.mon .lb svg{color:var(--cyan-hi);font-size:16px}
.mon .v{display:block;font-family:var(--mono);font-weight:600;font-size:clamp(28px,3vw,40px);color:var(--cyan-hi);line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(43,224,232,.25)}
.mon .u{font-size:13px;color:var(--deck-ink2)}
.kpis.sm .mon .v{font-size:clamp(24px,2.4vw,32px)}
.src{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.src div{background:var(--surface2);border:1px solid var(--rule);border-radius:8px;padding:9px 14px;font-size:12.5px;line-height:1.5;color:var(--ink2)}
.src div b{display:block;font-size:10.5px;font-family:var(--mono);letter-spacing:.12em;color:var(--cyan);margin-bottom:1px}

/* ---------- tables */
.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{background:var(--thead);color:var(--thead-ink);font-weight:600;padding:9px 10px;text-align:center;white-space:nowrap;border-bottom:2px solid var(--cyan-hi);font-family:var(--mono);font-size:13.5px}
table.t td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--rule);font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
table.t td+td{border-left:1px solid var(--rule)}
table.t tbody tr:nth-child(even) td{background:var(--zebra)}
table.t tbody tr:last-child td{border-bottom:0}
table.t tr.tot td{background:var(--total)!important;font-weight:700;border-top:2px solid var(--cyan)}
table.t tr.sub td{color:var(--ink2)}
table.t td.l{text-align:left;font-family:var(--sans)}
table.t.sm td.l{white-space:nowrap}
table.t.sm td.l.paper{white-space:normal;min-width:280px}
table.t td.b{font-weight:700}
table.t td.k{font-family:var(--sans);font-weight:700}
table.t.sm{font-size:13.5px}
table.t.sm th{padding:7px 8px;font-size:12.5px}table.t.sm td{padding:5px 8px}
table.t tr.sec td{background:var(--surface2)!important;text-align:left;font-family:var(--sans);font-weight:700;font-size:13px;color:var(--ink2)}
.lnk{font:inherit;color:var(--link);background:none;border:none;padding:0;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-align:left}
.lnk:hover{color:var(--warm)}
.cell2 small{display:block;color:var(--ink2);font-size:11.5px;line-height:1.2}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.g2b{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:start}
.panel{border:1px solid var(--rule);border-radius:10px;padding:14px 16px 10px;background:var(--surface)}
.panel h3{margin:0 0 6px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h3 svg{color:var(--cyan)}
.cbox{position:relative;height:420px}
.insight{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:700;font-size:16px;color:var(--ink);margin-top:16px;background:var(--surface2);border:1px dashed var(--cyan);border-radius:10px;padding:10px 14px}
.insight svg{color:var(--cyan)}
details.more{margin-top:20px}
details.more summary{cursor:pointer;font-weight:700;font-size:16px;color:var(--link);display:inline-flex;gap:8px;align-items:center}
.legend{display:flex;justify-content:center;gap:20px;margin-top:10px;font-size:13.5px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* ---------- lookup */
.qbar{display:flex;justify-content:center;gap:10px;margin:6px 0 24px;flex-wrap:wrap}
.qin{position:relative;width:380px;max-width:100%}
.qin svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cyan)}
.qin input{font:inherit;font-size:16px;padding:10px 14px 10px 40px;border:1px solid var(--rule);border-radius:8px;width:100%;background:var(--surface);color:var(--ink)}
.qin input:focus{border-color:var(--cyan);outline:2px solid rgba(10,143,156,.25)}
.qbar button{font:inherit;font-size:16px;background:var(--deck);color:#fff;border:1px solid var(--deck);border-radius:8px;padding:9px 22px;cursor:pointer;min-height:44px}
.pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pick button{font:inherit;font-size:14.5px;border:1px solid var(--rule);background:var(--surface2);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.pick button:hover{border-color:var(--cyan)}
.prof{display:flex;align-items:center;gap:14px;margin-bottom:4px;flex-wrap:wrap}
.prof .av{width:52px;height:52px;border-radius:50%;background:var(--deck);color:var(--cyan-hi);display:grid;place-items:center;font-size:22px;flex:none}
.prof h3{font-size:24px;margin:0;color:var(--ink)}
.prof p{color:var(--ink2);margin:0;font-family:var(--mono);font-size:13.5px}
.empty{text-align:center;color:var(--ink2);padding:30px 0}
.paper .j{font-size:12.5px;color:var(--ink2)}
.role{display:inline-block;font-size:11.5px;border:1px solid var(--cyan);color:var(--link);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap;font-family:var(--sans)}

tr.yoy td{background:var(--surface)!important;font-size:12.5px}
.dl{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--muted)}
.dl.up{color:var(--up)}.dl.dn{color:var(--dn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stats div{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
.stats div>svg{grid-row:1 / 4;font-size:20px;color:var(--cyan);width:40px!important;height:40px;padding:9px;background:var(--surface);border:1px solid var(--rule);border-radius:9px;box-sizing:border-box}
.stats span{font-size:13px;color:var(--ink2)}
.stats b{font-family:var(--mono);font-size:24px;line-height:1.2;color:var(--ink)}
.stats small{font-size:12.5px;color:var(--ink2);font-family:var(--mono)}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 14px 30px -12px rgba(7,33,44,.35);max-height:380px;overflow:auto;text-align:left}
.sug li{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.sug li[aria-selected="true"],.sug li:hover{background:var(--zebra);outline:1px solid var(--cyan)}
.sug li.none{display:block;color:var(--ink2);cursor:default;outline:0;background:none}
.sug .av{width:28px;height:28px;border-radius:50%;background:var(--deck);color:var(--cyan-hi);display:grid;place-items:center;font-size:12px}
.qin .sug svg{position:static;transform:none;color:inherit}
.sug .nm{font-weight:700;color:var(--ink);white-space:nowrap}
.sug .mt{font-family:var(--mono);font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug .am{font-family:var(--mono);font-size:12.5px;color:var(--link);white-space:nowrap}
.xbtn{margin-left:auto;font:inherit;font-size:14px;display:inline-flex;gap:8px;align-items:center;border:1px solid var(--cyan);color:var(--link);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px}
.xbtn:hover{background:var(--zebra)}

/* 左右滑動的表格：第一欄固定 */
.tw table.t th:first-child,.tw table.t td:first-child{position:sticky;left:0;z-index:1}
.tw table.t td:first-child{background:var(--surface)}
.tw table.t tbody tr:nth-child(even) td:first-child{background:var(--zebra)}
.tw table.t th:first-child{background:var(--thead);z-index:2}
.plist{display:none}
.nav .ls{display:none}

/* overview brief */
.brief{margin-top:18px;border:1px solid var(--rule);border-radius:12px;padding:16px 20px 6px;background:var(--surface)}
.brief h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px}
.brief h3 svg{color:var(--cyan)}
.brief ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.brief li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--rule)}
.brief .bi{width:34px;height:34px;border-radius:8px;background:var(--surface2);border:1px solid var(--rule);display:grid;place-items:center;color:var(--cyan);flex:none}
.brief .bh{display:block;font-size:13px;color:var(--cyan);letter-spacing:.06em;margin-bottom:2px}
.brief p{margin:0;font-size:15px;line-height:1.65;color:var(--ink)}
.brief p b{font-family:var(--mono);font-weight:600}
.brief em{font-style:normal;font-weight:700;display:inline-flex;align-items:center;gap:3px;font-size:13.5px;padding:0 6px;border-radius:5px}
.brief em.up{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}.brief em.dn{color:var(--dn);background:color-mix(in srgb,var(--dn) 12%,transparent)}

/* ---------- modal & toast */
.mbg{position:fixed;inset:0;background:rgba(4,19,26,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px 30px;overflow:auto}
.mbg.open{display:flex}
.modal{background:var(--surface);border-radius:12px;width:min(1100px,100%);overflow:hidden;border:1px solid var(--deck-line)}
.mh{background:var(--deck);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:2px solid var(--cyan-hi)}
.mh h4{margin:0;font-size:18px}
.mh button{background:none;border:none;color:#fff;font-size:26px;line-height:1;cursor:pointer;width:40px;height:40px}
.mb{padding:18px 20px 16px;max-height:calc(100vh - 160px);overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:var(--deck);color:var(--deck-ink);border:1px solid var(--cyan-hi);padding:10px 18px;border-radius:8px;font-size:14px;z-index:60;display:none;max-width:90vw}
input[type=file]{display:none}


/* ---------- 光線動畫（系統設定「減少動態效果」時關閉） */
@keyframes runline{to{stroke-dashoffset:-40}}
@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes flow{from{background-position:100% 0}to{background-position:-150% 0}}
@keyframes beam{from{background-position:-45% 0}to{background-position:145% 0}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(43,224,232,.55)}70%,100%{box-shadow:0 0 0 9px rgba(43,224,232,0)}}
@keyframes btnshine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:no-preference){
  .mast svg .run{animation:runline 4.2s linear infinite}
}

@media (max-width:980px){
  .mast-in{grid-template-columns:minmax(0,1fr);gap:8px;padding:10px 14px 2px}
  .brand{border-right:0;padding-right:0;min-width:0;gap:10px}.brand svg{height:30px}.brand b{font-size:16px}
  .ttl h1{font-size:19px}.ttl .meta{font-size:12px;gap:2px 14px;margin-top:4px}.ttl .meta .fn{display:none}
  .acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.sbtn{min-height:34px;padding:5px 6px;font-size:12.5px;gap:6px}
  .ecg-strip{height:20px}
  .nav{position:sticky}.nav-in{grid-template-columns:repeat(5,minmax(0,1fr));padding:4px 6px;gap:2px}
  .nav button{font-size:11.5px;padding:7px 2px 6px;border-radius:8px;gap:3px}.nav button .ic{font-size:14px}
  .nav .lf{display:none}.nav .ls{display:block}
  .nav button[aria-selected="true"]::after{display:none}.nav button[aria-selected="true"]{background:rgba(43,224,232,.16)}
  main{padding:12px 10px 28px}
  .card{padding:18px 14px 0;min-height:auto;border-radius:12px}
  .sh{gap:12px;margin-bottom:14px}.sh .icb{width:38px;height:38px;font-size:16px}.sh .tx{min-width:0}
  .g2,.g2b,.hero,.src{grid-template-columns:minmax(0,1fr)}
  .hero{min-height:0}.hero .lt{padding:18px 18px 52px;gap:10px}.hero .ph{min-height:170px;order:-1}
  .hero .ph img{-webkit-mask-image:linear-gradient(0deg,transparent 0,#000 40%);mask-image:linear-gradient(0deg,transparent 0,#000 40%)}
  .deltas .big{font-size:40px}.deltas .ft{font-size:13px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mon{padding:12px 14px 10px}.mon .v{font-size:26px}
  h2.pt{font-size:20px}.psub{font-size:13.5px}.cbox{height:300px}.panel{padding:12px 10px 8px}
  .stats,.brief ul{grid-template-columns:minmax(0,1fr)}.deltas{gap:12px 28px}.sug li{grid-template-columns:auto 1fr auto}.sug .mt{grid-column:2 / 4;grid-row:2}
  .brief{padding:14px 14px 4px}.brief p{font-size:14px}
  table.t th,table.t td,table.t td.l{white-space:nowrap}
  table.t{font-size:13.5px}table.t th{padding:7px 8px}table.t td{padding:6px 8px}
  .tw table.t th:first-child,.tw table.t td:first-child{box-shadow:2px 0 0 var(--rule)}
  .ptable{display:none}
  .plist{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
  .plist li{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;background:var(--surface)}
  .plist .pt2{font-size:14px;font-weight:600;line-height:1.45;color:var(--ink)}
  .plist .pj{font-size:12.5px;color:var(--ink2);margin-top:3px}
  .plist .pm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .plist .pm span{font-size:11.5px;border:1px solid var(--rule);border-radius:4px;padding:1px 6px;color:var(--ink2)}
  .plist .pb{display:block;margin-top:8px;font-family:var(--mono);font-size:15px;color:var(--link)}
  .prof h3{font-size:21px}.xbtn{margin-left:0}
  .mb{padding:12px 10px}.mbg{padding:calc(env(safe-area-inset-top,0px) + 16px) 8px 16px}

}

/* Prominent year-over-year comparison panel */
.yoy-feature{margin-top:18px;padding:22px 24px;background:var(--surface);border:2px solid var(--cyan);border-radius:12px;box-shadow:0 8px 24px -18px rgba(3,71,84,.55)}
.yoy-feature-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.yoy-feature-head h3{font-size:20px;margin:0;color:var(--ink)}
.yoy-feature-head small{font-size:13px;color:var(--muted)}
.yoy-feature-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.yoy-feature-card{padding:18px;border-radius:10px;background:var(--surface2);border:1px solid var(--rule);min-width:0}
.yoy-feature-label{font-size:14px;font-weight:700;color:var(--ink2)}
.yoy-feature-change{font:700 clamp(34px,4.1vw,55px)/1.13 var(--mono);margin:8px 0 4px;font-variant-numeric:tabular-nums}
.yoy-feature-change.up{color:var(--up)}.yoy-feature-change.dn{color:var(--dn)}
.yoy-feature-change.neutral{color:var(--ink)}
.yoy-feature-amount{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:10px}
.yoy-feature-pair{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.yoy-feature-pair b{color:var(--ink);font-family:var(--mono);font-size:15px}
.yoy-feature-foot{font-size:12.5px;color:var(--muted);margin-top:12px}
@media(max-width:700px){.yoy-feature{padding:16px}.yoy-feature-grid{grid-template-columns:1fr}.yoy-feature-change{font-size:40px}}

</style>
</head>

function saveImportedRows(rows,file){

function loadInitialData(){
  try{
    const raw=window.localStorage.getItem(DATA_STORAGE_KEY);
    if(raw!==null){
      const saved=JSON.parse(raw);
      if(saved.version!==1||typeof saved.file!=='string'||!Array.isArray(saved.rows)||!saved.rows.length||!saved.rows.every(r=>r&&typeof r==='object'&&!Array.isArray(r)))throw new Error('Invalid saved dashboard data');
      const restored=build(saved.rows,saved.file);
      if(!restored.recs.length)throw new Error('Saved dashboard data contains no usable records');
      dataSavedAt=typeof saved.savedAt==='string'?saved.savedAt:'';
      dataStorageStatus='已讀取本機儲存資料';activeRows=saved.rows;return restored;
    }
  }catch(error){
    console.error('Saved data could not be restored',error);
    dataStorageStatus='本機資料未能讀取，目前使用內建資料';
    dataStorageWarning='未能讀取本機儲存資料，目前顯示內建資料。請重新匯入最新 Excel；原有儲存內容未刪除。';
  }
  activeRows=builtInRows();return build(activeRows,'110-115年度醫師論文申請.xls');
}

function build(rows,file){
  const recs=[],fees=[],latest={};let cutY=0,cutM=0;const unk=new Set();
  for(const r0 of rows){
    const r={};for(const k in r0){const v=String(r0[k]??'');for(const c of v)if(/[-]/.test(c)&&!PUA[c])unk.add(c.codePointAt(0).toString(16).toUpperCase());r[k]=fixPUA(v);}
    const g=k=>r[k]||'';
    const ap=g('申請者').trim().split(/\s+/);const id=ap[0];if(!id)continue;const nm=ap.slice(1).join('')||id;
    const sn=g('流水號').trim(),pub=g('發表日期').trim();
    let y=parseInt(sn.slice(0,3),10);if(!(y>0))y=parseInt(pub.slice(0,4),10)-1911;if(!(y>0))continue;
    const dept=g('申請者科別').trim().replace(/^\d+\s*/,'');
    if(dept&&(!latest[id]||sn>=latest[id][0]))latest[id]=[sn,dept];
    const s=g('主管簽章').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(s){const sy=+s[3]-1911,sm=+s[1];if(sy>cutY||(sy===cutY&&sm>cutM)){cutY=sy;cutM=sm;}}
    const am=parseInt(g('申請序號').slice(4,6),10)||null;
    const base={id,nm,y,sn,am,ym:pub,b:parseFloat(g('獎金'))||0,t:g('論文名稱').replace(/@@|\r?\n/g,' ').replace(/\s+/g,' ').trim(),j:g('發表之雜誌/期刊').trim()};
    if(/刊登費/.test(g('申請項目'))){fees.push(base);continue;}
    const c=g('論文類別').trim();
    const k=c.includes('會議')?(c.includes('國際')?'國際性醫學會議':'全國性醫學會議'):(c.startsWith('SCI')?'SCI':'非SCI');
    const num=(v,re)=>{const m=String(v||'').match(re);const x=m?parseFloat(m[1]):0;return x>0?x:null;};
    let role='';const au=[1,2,3,4,5,6].map(i=>g('作者'+i)).find(a=>/\[[^\]]*申[^\]]*\]/.test(a));
    if(au){const m=au.match(/\[([^\]]*)\]\s*(\d+)\./);if(m)role=`第${m[2]}作者${m[1].includes('通')?'・通訊':''}`;}
    recs.push(Object.assign(base,{c,k,f:num(g('IF'),/IF\s*([\d.]+)/),rk:num(g('學門排行'),/Rank\s*([\d.]+)/),p:g('發表地點').trim(),role}));
  }
  [...recs,...fees].forEach(x=>{x.dv=latest[x.id]?latest[x.id][1]:'未填科別';});
  const years=[...new Set([...recs,...fees].map(r=>r.y))].sort((a,b)=>a-b);
  if(!cutY){const mx=recs.reduce((a,r)=>r.ym>a?r.ym:a,'0');cutY=+mx.slice(0,4)-1911;cutM=+mx.slice(4,6);}
  return {recs,fees,years,cutY,cutM,file,unknownPUA:[...unk]};
}

function yearComparisonPanel(){
 const y=LAST(),m=D.cutM;
 if(!Y().includes(y-1)||!Number.isFinite(m)||m<1||m>12)return '';
 const inPeriod=r=>r.am&&r.am<=m;
 const cur=D.recs.filter(r=>r.y===y&&inPeriod(r)),prior=D.recs.filter(r=>r.y===y-1&&inPeriod(r));
 if(!prior.length)return '';
 const b0=sum(prior),b1=sum(cur),n0=prior.length,n1=cur.length;
 const block=(label,now,old,isMoney)=>{
  const delta=now-old;if(delta<=0||old<=0)return '';
  const pct=Math.round(delta/old*1000)/10;
  const display=v=>isMoney?w1(v)+' 萬元':fmt(v)+' 筆';
  return `<div class="yoy-feature-card"><div class="yoy-feature-label">${label}｜較 ${y-1} 年同期</div>
   <div class="yoy-feature-change up">${icon('fa-arrow-trend-up')} +${pct}%</div>
   <div class="yoy-feature-amount">+${display(delta)}</div>
   <div class="yoy-feature-pair"><span>${y} 年 <b>${display(now)}</b></span><span>${y-1} 年 <b>${display(old)}</b></span></div></div>`;
 };
 const cards=[block('論文獎金',b1,b0,true),block('論文獎勵紀錄',n1,n0,false)].filter(Boolean);
 if(!cards.length)return '';

   <div class="yoy-feature-head"><h3>${icon('fa-chart-line')} ${y} 年同期成長亮點</h3><small>與 ${y-1} 年 1–${m} 月比較</small></div>

}
function briefData(){

  const chip=p=>`<em class="${p>=0?'up':'dn'}">${icon(p>=0?'fa-arrow-trend-up':'fa-arrow-trend-down')}${p>=0?'+':''}${p}%</em>`;

  if(D.recs.some(r=>r.am)&&Y().includes(L-1)){const m=D.cutM;const cur=D.recs.filter(r=>r.y===L&&r.am&&r.am<=m),prv=D.recs.filter(r=>r.y===L-1&&r.am&&r.am<=m);
    if(prv.length){const p=pct(sum(prv),sum(cur));out.push(['fa-gauge-high','今年進度',`${L} 年 1–${m} 月獎金 <b>${w1(sum(cur))}</b> 萬元；論文獎勵紀錄 <b>${cur.length}</b> 筆${p>0?`；獎金較去年同期 ${chip(p)}`:''}`]);}}
  // 2 歷年高點
  if(full.length){const bv=full.map(y=>sum(D.recs.filter(r=>r.y===y))),mx=Math.max(...bv),my=full[bv.indexOf(mx)],last=full[full.length-1];
    out.push(['fa-trophy','歷年高點',my===last?`<b>${my}</b> 年 <b>${w1(mx)}</b> 萬元，為 ${full[0]}–${last} 年最高（創新高）`:`最高為 <b>${my}</b> 年 <b>${w1(mx)}</b> 萬元；${last} 年為 ${w1(bv[bv.length-1])} 萬元`]);}

  const tv=yearVals(rs,metric);
  const html=`<div class="tw"><table class="t sm"><thead><tr><th>#</th><th>姓名</th>${Y().map(y=>`<th>${yl(y)}</th>`).join('')}<th>累計</th></tr></thead><tbody>
   ${ppl.map((p,i)=>`<tr><td>${i+1}</td><td class="l"><button class="lnk" data-id="${esc(p.id)}">${esc(p.nm)}</button></td>${p.v.map(x=>`<td>${f(x)}</td>`).join('')}<td class="b">${f(p.tot)}</td></tr>`).join('')}
   <tr class="tot"><td></td><td class="k">合計</td>${tv.map(x=>`<td>${f(x)}</td>`).join('')}<td>${f(tv.reduce((a,b)=>a+b,0))}</td></tr>
   <tr class="sec"><td colspan="${Y().length+3}">論文類別統計</td></tr>
   ${CATS.map(k=>{const v=yearVals(rs.filter(r=>r.k===k),metric);return `<tr><td></td><td class="l">${k}</td>${v.map(x=>`<td>${f(x)}</td>`).join('')}<td>${f(v.reduce((a,b)=>a+b,0))}</td></tr>`;}).join('')}
   </tbody></table></div><p class="note">共 ${ppl.length} 人｜單位：${metric==='b'?'萬元':'篇數'}｜依累計${metric==='b'?'獎金':'篇數'}排序。點選姓名可開啟個人查詢。${STAR()}</p>`;

function catModal(k){
  const rs=D.recs.filter(r=>r.k===k);const subs=[...groupBy(rs,'c')].sort((a,b)=>b[1].length-a[1].length);
  const block=(metric)=>{const f=metric==='b'?w1:fmt;const tv=yearVals(rs,metric);const T=tv.reduce((a,b)=>a+b,0);
    const pct=(x,t)=>t?(Math.round(x/t*1000)/10)+'%':'0%';
    return `<div class="tw"><table class="t sm"><thead>${yearHead('細分類別')}</thead><tbody>${subs.map(([c,x])=>{const v=yearVals(x,metric);const s=v.reduce((a,b)=>a+b,0);
      return `<tr><td class="l" title="${esc(c)}">${esc(shortCat(c))}</td>${v.map((q,i)=>`<td class="cell2">${f(q)}<small>${pct(q,tv[i])}</small></td>`).join('')}<td class="cell2 b">${f(s)}<small>${pct(s,T)}</small></td></tr>`;}).join('')}
      <tr class="tot"><td class="k">合計</td>${tv.map(x=>`<td>${f(x)}</td>`).join('')}<td>${f(T)}</td></tr></tbody></table></div>`;};
  openModal(`${k}｜細分類別統計`,`<div class="stitle" style="margin-top:0">篇數（佔比）</div>${block('n')}<div class="stitle">獎金（萬元，佔比）</div>${block('b')}<p class="note">佔比為該細分類別占當年度「${k}」合計之比例。${STAR()}</p>`);
}

const fileIn=document.getElementById('file');
const normKey=x=>String(x??'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const rowId=r=>String(r['申請者']||'').trim().split(/\s+/)[0];
const typeOf=r=>/刊登費/.test(String(r['申請項目']||''))?'費':'論';
const money=r=>Number(String(r['獎金']||0).replace(/,/g,''))||0;
const keyOf=r=>[typeOf(r),normKey(rowId(r)),normKey(r['論文名稱']),money(r)].join('|');
const softKey=r=>[typeOf(r),normKey(rowId(r)),normKey(r['論文名稱'])].join('|');

 try{

fileIn.onchange=async()=>{
 const f=fileIn.files[0];fileIn.value='';if(!f)return;
 if(typeof XLSX==='undefined'){toast('Excel 元件未載入');return;}
 try{
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});let incoming=null;
  for(const sn of wb.SheetNames){
   const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:false});
   if(rows.length&&['流水號','申請者','申請項目','論文類別','論文名稱','獎金'].every(k=>Object.keys(rows[0]).includes(k))){incoming=rows;break;}
  }
  if(!incoming){alert('請使用院內系統的原始論文申請 .xls/.xlsx；整理後的統計報表不適用。');return;}
  const old=currentRawRows(),seen=new Set(old.map(keyOf)),soft=new Map(old.map(r=>[softKey(r),money(r)]));
  const added=[],duplicates=[],conflicts=[],invalid=[];
  for(const r of incoming){
   if(!rowId(r)||!String(r['論文名稱']||'').trim()||!String(r['流水號']||'').trim()){invalid.push(r);continue;}
   const k=keyOf(r),softK=softKey(r);
   if(seen.has(k)){duplicates.push(r);continue;}
   if(soft.has(softK)&&soft.get(softK)!==money(r)){conflicts.push(r);continue;}
   added.push(r);seen.add(k);soft.set(softK,money(r));
  }
  if(invalid.length||conflicts.length){
   alert('發現需人工核對的紀錄，未修改資料。\n必要欄位不完整：'+invalid.length+' 筆\n同論文申請人但金額不同：'+conflicts.length+' 筆');return;
  }
  const newP=added.filter(r=>typeOf(r)==='論'),newF=added.filter(r=>typeOf(r)==='費');
  const amtP=newP.reduce((a,r)=>a+money(r),0),amtF=newF.reduce((a,r)=>a+money(r),0);
  const merged=old.concat(added),nd=build(merged,f.name);
  if(!added.length){alert('上傳 '+incoming.length+' 筆均已存在，資料沒有變更。');return;}
  if(!confirm('安全匯入預覽（尚未修改）\n\n目前：論文 '+D.recs.length+' 筆、刊登費 '+D.fees.length+' 筆\n新檔 '+incoming.length+' 筆；略過重複 '+duplicates.length+' 筆\n\n新增論文 '+newP.length+' 筆（'+fmt(amtP)+' 元）\n新增刊登費 '+newF.length+' 筆（'+fmt(amtF)+' 元）\n\n更新後：論文 '+nd.recs.length+' 筆、刊登費 '+nd.fees.length+' 筆\n\n確認合併並備份前版？'))return;
  const prev={version:1,rows:old,file:D.file,savedAt:new Date().toISOString()},prior=localStorage.getItem(DATA_BACKUP_KEY);
  try{
   localStorage.setItem(DATA_BACKUP_KEY,JSON.stringify(prev));
   if(!saveImportedRows(merged,f.name))throw Error('無法儲存');
  }catch(e){
   try{if(prior===null)localStorage.removeItem(DATA_BACKUP_KEY);else localStorage.setItem(DATA_BACKUP_KEY,prior);}catch(_){}
   alert('瀏覽器儲存失敗，更新已取消。');return;
  }
  activeRows=merged;D=nd;qState='';
  Object.values(charts).forEach(c=>c.destroy());for(const k in charts)delete charts[k];
  renderAll();toast('完成：新增論文 '+newP.length+' 筆、刊登費 '+newF.length+' 筆。可按「還原前版」恢復。',8000);
 }catch(e){console.error(e);toast('匯入失敗：'+e.message);}
};

const recRow=r=>({'申請年度':r.y,'人事號':r.id,'姓名':r.nm,'科別':r.dv,'論文分類':r.k,'論文類別（原始）':r.c,'論文名稱':r.t,'期刊／會議':r.j,'發表年月':r.ym?(+r.ym.slice(0,4)-1911)+'/'+r.ym.slice(4,6):'','IF':r.f||'','學門排行%':r.rk||'','申請者作者序':r.role,'獎金（元）':r.b});
async function saveBlob(name,blob){if(dl){await dl.save({filename:name,data:blob});}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}}
async function exportXlsx(person){
  if(typeof XLSX==='undefined'){toast('Excel 元件沒有載入，請確認網路後重新整理頁面。');return;}
  try{const wb=XLSX.utils.book_new();const add=(rows,name,w)=>{const ws=XLSX.utils.json_to_sheet(rows);if(w)ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name);};
    const ys=Y();let fname;
    if(person){const rs=[...person.rs].sort((a,b)=>b.sn.localeCompare(a.sn));
      add(rs.map(recRow),'論文明細',[8,10,8,12,10,28,60,30,9,7,9,12,10]);
      add(D.fees.filter(f=>f.id===person.id).map(f=>({'申請年度':f.y,'論文名稱':f.t,'期刊':f.j,'刊登費（元）':f.b})),'刊登費',[8,60,30,12]);
      fname=`${person.nm}_${person.id}_論文獎金明細.xlsx`;}
    else{
      add(D.recs.map(recRow).sort((a,b)=>a['申請年度']-b['申請年度']||a['科別'].localeCompare(b['科別'])),'論文明細',[8,10,8,12,10,28,60,30,9,7,9,12,10]);
      add(D.fees.map(f=>({'申請年度':f.y,'人事號':f.id,'姓名':f.nm,'科別':f.dv,'論文名稱':f.t,'期刊':f.j,'刊登費（元）':f.b})),'刊登費明細',[8,10,8,12,60,30,12]);
      add(peopleAgg().map((p,i)=>Object.assign({'排名':i+1,'人事號':p.id,'姓名':p.nm,'科別':p.dv},Object.fromEntries(ys.map(y=>[yl(y)+'（元）',sum(p.rs.filter(r=>r.y===y))])),{'累計獎金（元）':p.b,'篇數':p.n,'SCI 篇數':p.sci})),'個人統計');
      const dvRows=m=>deptAgg().map(d=>Object.assign({'科別':d.dv},Object.fromEntries(ys.map((y,i)=>[yl(y),yearVals(d.rs,m)[i]])),{'累計':m==='b'?d.b:d.n,'人數':d.p}));
      add(dvRows('n'),'科別年度篇數');add(dvRows('b'),'科別年度獎金（元）');
      fname=`${ORGS}_${rangeTxt()}_論文獎金明細.xlsx`;}
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    await saveBlob(fname,new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));toast('已匯出 Excel。');
  }catch(e){if(e&&e.code==='declined')toast('已取消匯出。');else{console.error(e);toast('匯出失敗：'+(e.message||e.code||e));}}
}
