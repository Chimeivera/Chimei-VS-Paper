name: Publish approved paper Excel data
on:
  push:
    branches: [main]
    paths:
      - 'data/論文申請資料.xlsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-paper-data
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel parser
        run: python -m pip install openpyxl==3.1.5
      - name: Validate full Excel, prevent duplicate and historical overwrites
        run: python scripts/update_paper_data.py
      - name: Commit published data when validated
        run: |
          if git diff --quiet -- index.html; then
            echo "No data change to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish validated updated paper records"
          git push
